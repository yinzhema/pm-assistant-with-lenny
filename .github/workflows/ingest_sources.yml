name: Ingest Web Sources

on:
  schedule:
    # Weekly, Monday 6am UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source ID to ingest (leave empty for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (fetch only, no Pinecone writes)'
        required: false
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        run: |
          SOURCE_ARG=""
          if [ -n "${{ github.event.inputs.source }}" ]; then
            SOURCE_ARG="--source ${{ github.event.inputs.source }}"
          fi
          DRY_RUN_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi
          python scripts/ingest_web_sources.py $SOURCE_ARG $DRY_RUN_ARG
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}

      - name: Commit updated BM25 corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bm25_corpus.jsonl || true
          git diff --staged --quiet || git commit -m "chore: update BM25 corpus after weekly ingestion"
          git push || true
        if: github.event.inputs.dry_run != 'true'
