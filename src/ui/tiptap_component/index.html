<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AskProduct Editor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #fff;
    color: #111827;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── Toolbar ── */
  #toolbar {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 6px 10px;
    border-bottom: 1px solid #e5e7eb;
    background: #fafafa;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  #toolbar button {
    background: none;
    border: 1px solid transparent;
    border-radius: 5px;
    padding: 4px 7px;
    font-size: 13px;
    cursor: pointer;
    color: #374151;
    transition: all 0.1s;
    min-width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #toolbar button:hover { background: #f3f4f6; border-color: #d1d5db; }
  #toolbar button.active { background: #e0e7ff; border-color: #6366f1; color: #4338ca; }
  #toolbar .sep { width: 1px; height: 20px; background: #e5e7eb; margin: 0 4px; }

  /* ── Editor area ── */
  #editor-wrap {
    padding: 20px 24px;
    min-height: 300px;
    overflow-y: auto;
  }

  .ProseMirror {
    outline: none;
    min-height: 260px;
  }
  .ProseMirror p { margin-bottom: 0.75em; }
  .ProseMirror h1 { font-size: 1.6em; font-weight: 700; margin: 1em 0 0.4em; }
  .ProseMirror h2 { font-size: 1.3em; font-weight: 600; margin: 0.9em 0 0.35em; color: #1f2937; }
  .ProseMirror h3 { font-size: 1.1em; font-weight: 600; margin: 0.8em 0 0.3em; color: #374151; }
  .ProseMirror ul, .ProseMirror ol { padding-left: 1.6em; margin-bottom: 0.75em; }
  .ProseMirror li { margin-bottom: 0.25em; }
  .ProseMirror blockquote {
    border-left: 3px solid #6366f1;
    padding-left: 12px;
    margin: 0.75em 0;
    color: #6b7280;
    font-style: italic;
  }
  .ProseMirror code {
    background: #f3f4f6;
    padding: 1px 5px;
    border-radius: 4px;
    font-family: 'Fira Code', monospace;
    font-size: 0.88em;
  }
  .ProseMirror hr { border: none; border-top: 2px solid #e5e7eb; margin: 1em 0; }

  /* Tables */
  .ProseMirror table {
    border-collapse: collapse;
    width: 100%;
    margin: 1em 0;
    font-size: 0.9em;
  }
  .ProseMirror th, .ProseMirror td {
    border: 1px solid #d1d5db;
    padding: 8px 12px;
    text-align: left;
  }
  .ProseMirror th {
    background: #f3f4f6;
    font-weight: 600;
    color: #374151;
  }
  .ProseMirror tr:nth-child(even) td { background: #fafafa; }

  /* Placeholder */
  .ProseMirror p.is-editor-empty:first-child::before {
    content: attr(data-placeholder);
    color: #9ca3af;
    pointer-events: none;
    float: left;
    height: 0;
  }

  /* ── Selection bubble menu ── */
  #bubble-menu {
    display: none;
    position: fixed;
    background: #1f2937;
    border-radius: 8px;
    padding: 4px;
    gap: 2px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    z-index: 100;
  }
  #bubble-menu button {
    background: none;
    border: none;
    color: #f9fafb;
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s;
  }
  #bubble-menu button:hover { background: #374151; }

  /* ── AI loading overlay ── */
  #ai-loading {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.7);
    align-items: center;
    justify-content: center;
    z-index: 200;
    font-size: 14px;
    color: #6366f1;
    gap: 8px;
  }
  #ai-loading.show { display: flex; }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid #e0e7ff;
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="toolbar">
  <button id="btn-bold" onclick="fmt('bold')" title="Bold"><b>B</b></button>
  <button id="btn-italic" onclick="fmt('italic')" title="Italic"><i>I</i></button>
  <div class="sep"></div>
  <button onclick="fmt('h1')" title="Heading 1"><b>H1</b></button>
  <button onclick="fmt('h2')" title="Heading 2"><b>H2</b></button>
  <button onclick="fmt('h3')" title="Heading 3"><b>H3</b></button>
  <div class="sep"></div>
  <button onclick="fmt('bulletList')" title="Bullet list">• List</button>
  <button onclick="fmt('orderedList')" title="Numbered list">1. List</button>
  <div class="sep"></div>
  <button onclick="fmt('table')" title="Insert table">⊞ Table</button>
  <button onclick="fmt('hr')" title="Divider">—</button>
</div>

<div id="editor-wrap">
  <div id="editor"></div>
</div>

<div id="bubble-menu">
  <button onclick="triggerAI('improve')">✨ Improve</button>
  <button onclick="triggerAI('expand')">📝 Expand</button>
  <button onclick="triggerAI('critique')">🔍 Critique</button>
  <button onclick="triggerAI('simplify')">✂️ Simplify</button>
</div>

<div id="ai-loading">
  <div class="spinner"></div>
  <span>AI is working…</span>
</div>

<script type="module">
import { Editor } from 'https://esm.sh/@tiptap/core@2.1.16';
import StarterKit from 'https://esm.sh/@tiptap/starter-kit@2.1.16';
import Table from 'https://esm.sh/@tiptap/extension-table@2.1.16';
import TableRow from 'https://esm.sh/@tiptap/extension-table-row@2.1.16';
import TableCell from 'https://esm.sh/@tiptap/extension-table-cell@2.1.16';
import TableHeader from 'https://esm.sh/@tiptap/extension-table-header@2.1.16';
import Placeholder from 'https://esm.sh/@tiptap/extension-placeholder@2.1.16';

// ── Streamlit component protocol ─────────────────────────────────────────────
let _pendingContent = null;
let _pendingHeight  = null;
let _readonly       = false;
let _initialized    = false;

function sendToStreamlit(value) {
  window.parent.postMessage({ type: 'streamlit:setComponentValue', value, isWidget: true }, '*');
}
function setFrameHeight(h) {
  window.parent.postMessage({ type: 'streamlit:setFrameHeight', height: h }, '*');
}
function ready() {
  window.parent.postMessage({ type: 'streamlit:componentReady', apiVersion: 1 }, '*');
}

window.addEventListener('message', (event) => {
  if (event.data.type === 'streamlit:render') {
    const args = event.data.args || {};
    _pendingContent = args.content ?? '';
    _pendingHeight  = args.height  ?? 520;
    _readonly       = args.readonly ?? false;
    if (_initialized) applyProps();
  }
});

// ── Editor ───────────────────────────────────────────────────────────────────
let editor;
let bubbleMenu = document.getElementById('bubble-menu');
let aiLoading  = document.getElementById('ai-loading');

function applyProps() {
  if (_pendingContent !== null && editor) {
    // Only set content if it actually changed (avoids cursor reset on every render)
    const current = editor.getHTML();
    if (_pendingContent !== current) {
      editor.commands.setContent(_pendingContent || '<p></p>', false);
    }
  }
  if (_pendingHeight) {
    setFrameHeight(_pendingHeight);
    document.getElementById('editor-wrap').style.maxHeight = (_pendingHeight - 50) + 'px';
  }
  if (_readonly !== undefined && editor) {
    editor.setEditable(!_readonly);
  }
}

// Delayed init to let Streamlit send the first render message
window.addEventListener('DOMContentLoaded', () => {
  editor = new Editor({
    element: document.getElementById('editor'),
    extensions: [
      StarterKit,
      Table.configure({ resizable: false }),
      TableRow,
      TableCell,
      TableHeader,
      Placeholder.configure({ placeholder: 'Start typing or generate a document from the chat…' }),
    ],
    content: '',
    editable: true,
    onSelectionUpdate({ editor }) {
      const { from, to } = editor.state.selection;
      if (from !== to) {
        showBubble(editor);
      } else {
        hideBubble();
      }
    },
    onBlur() { hideBubble(); },
  });

  _initialized = true;
  applyProps();
  ready();
  setFrameHeight(_pendingHeight || 520);
});

// ── Toolbar actions ───────────────────────────────────────────────────────────
window.fmt = function(cmd) {
  if (!editor) return;
  switch (cmd) {
    case 'bold':        editor.chain().focus().toggleBold().run(); break;
    case 'italic':      editor.chain().focus().toggleItalic().run(); break;
    case 'h1':          editor.chain().focus().toggleHeading({ level: 1 }).run(); break;
    case 'h2':          editor.chain().focus().toggleHeading({ level: 2 }).run(); break;
    case 'h3':          editor.chain().focus().toggleHeading({ level: 3 }).run(); break;
    case 'bulletList':  editor.chain().focus().toggleBulletList().run(); break;
    case 'orderedList': editor.chain().focus().toggleOrderedList().run(); break;
    case 'hr':          editor.chain().focus().setHorizontalRule().run(); break;
    case 'table':
      editor.chain().focus()
        .insertTable({ rows: 3, cols: 3, withHeaderRow: true })
        .run();
      break;
  }
};

// ── Bubble menu ───────────────────────────────────────────────────────────────
function showBubble(ed) {
  const { from, to } = ed.state.selection;
  if (from === to) return;
  const coords = ed.view.coordsAtPos(from);
  bubbleMenu.style.display = 'flex';
  bubbleMenu.style.top  = (coords.top - 44 + window.scrollY) + 'px';
  bubbleMenu.style.left = (coords.left) + 'px';
}
function hideBubble() {
  bubbleMenu.style.display = 'none';
}

window.triggerAI = function(action) {
  if (!editor) return;
  const { from, to } = editor.state.selection;
  const selectedText = from !== to
    ? editor.state.doc.textBetween(from, to, ' ')
    : '';
  const fullHtml = editor.getHTML();
  hideBubble();
  aiLoading.classList.add('show');
  sendToStreamlit({
    type: 'action',
    action,
    selectedText,
    fullHtml,
    timestamp: Date.now(),
  });
};

// ── Save / Export (called from Python-injected buttons in document_canvas.py) ─
window.triggerSave = function() {
  if (!editor) return;
  sendToStreamlit({
    type: 'action',
    action: 'save',
    selectedText: '',
    fullHtml: editor.getHTML(),
    timestamp: Date.now(),
  });
};
window.triggerExport = function(format) {
  if (!editor) return;
  sendToStreamlit({
    type: 'action',
    action: 'export_' + format,  // 'export_md' | 'export_excel'
    selectedText: '',
    fullHtml: editor.getHTML(),
    timestamp: Date.now(),
  });
};
</script>
</body>
</html>
